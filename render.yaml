# Render Blueprint for the NestJS backend. The database lives on Neon, so there is no database block here.
services:
  - type: web
    name: outpatient-scheduler-api
    runtime: node
    rootDir: backend
    plan: free
    # NODE_ENV=production makes npm skip devDependencies, but the Nest build needs them.
    buildCommand: npm install --include=dev && npm run build
    # The free plan has no pre-deploy step. start:prod applies pending migrations, adds the demo data that is
    # missing (it never overwrites existing rows; set SKIP_DEMO_SEED=true to turn that off), then starts the API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon DIRECT connection string, entered in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # Vercel URL, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false # The same Vercel URL: used for links in emails (receptionist invitations)
      # Email is sent only through Resend in production. Without BOTH of these, email is switched off (and the app says so).
      - key: RESEND_API_KEY
        sync: false # From the Resend dashboard (API Keys)
      - key: EMAIL_FROM
        sync: false # e.g. CareSlot <no-reply@your-verified-domain>; the domain must be verified in Resend (not onboarding@resend.dev)
